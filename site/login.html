<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — Squads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(37,99,235,0.18) 0%, transparent 70%),
    #080d1a;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #0d1424;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.logo {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 24px; color: white;
  margin: 0 auto 24px;
}
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
input {
  width: 100%;
  background: #080d1a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 15px;
  color: #ffffff;
  font-family: inherit;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: #3b82f6; }
input::placeholder { color: #475569; }
button {
  width: 100%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  border-radius: 90px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: inset 0 4px 12px rgba(255,255,255,0.15), 0 4px 16px rgba(37,99,235,0.35);
  transition: all 0.2s ease;
}
button:hover { transform: translateY(-1px); box-shadow: inset 0 4px 12px rgba(255,255,255,0.2), 0 6px 20px rgba(37,99,235,0.45); }
button:disabled { background: #1e293b; box-shadow: none; cursor: not-allowed; transform: none; }
.msg {
  margin-top: 16px;
  font-size: 13px;
  padding: 12px;
  border-radius: 10px;
  display: none;
}
.msg.success { background: rgba(6,182,212,0.1); color: #22d3ee; border: 1px solid rgba(6,182,212,0.25); display: block; }
.msg.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.25); display: block; }
.footer { margin-top: 24px; font-size: 12px; color: #475569; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">S</div>
  <h1>Acessar os Squads</h1>
  <p>Digite seu email de compra. Vamos enviar um link de acesso direto — sem senha.</p>
  <input type="email" id="email" placeholder="seu@email.com" />
  <button id="btn" onclick="enviarLink()">Enviar link de acesso</button>
  <div class="msg" id="msg"></div>
  <div class="footer">Problemas? Fale com o suporte.</div>
</div>

<script>
const SUPABASE_URL = 'https://vvzeczcfreebqtuhahyg.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2emVjemNmcmVlYnF0dWhhaHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDM0NzEsImV4cCI6MjA5NjYxOTQ3MX0.ZF1B6yl27Kxi8_vZJ6yloVJozNPo06ttSbVafcOsH_Y'

const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

async function enviarLink() {
  const email = document.getElementById('email').value.trim().toLowerCase()
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')

  if (!email || !email.includes('@')) {
    msg.className = 'msg error'
    msg.textContent = 'Digite um email válido.'
    return
  }

  btn.disabled = true
  btn.textContent = 'Enviando...'
  msg.className = 'msg'

  // Verifica se email está na tabela membros com status ativo
  const { data: resultado, error: rpcError } = await sb
    .rpc('verificar_membro', { p_email: email })

  console.log('resultado:', resultado, 'erro:', rpcError)

  if (!resultado || resultado.status !== 'ativo') {
    msg.className = 'msg error'
    msg.textContent = 'Email não encontrado. Verifique se usou o mesmo email da compra.'
    btn.disabled = false
    btn.textContent = 'Enviar link de acesso'
    return
  }

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: 'https://lucasvalerio10.github.io/squads/site/aulas.html'
    }
  })

  if (error) {
    msg.className = 'msg error'
    msg.textContent = 'Algo deu errado. Tenta de novo.'
    btn.disabled = false
    btn.textContent = 'Enviar link de acesso'
    return
  }

  msg.className = 'msg success'
  msg.textContent = '✓ Link enviado! Verifique sua caixa de entrada (e o spam).'
  btn.textContent = 'Link enviado ✓'
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') enviarLink()
})
</script>
</body>
</html>
